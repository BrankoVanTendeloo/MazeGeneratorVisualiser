<div class="min-vh-100 d-flex flex-column">
    <div class="container text-center mt-5">
        <h1 class="mb-4">Maze Generator Visualiser</h1>
    </div>
    <div class="container" id="maze-settings">
        <div class="row">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-walls" value="walls">
                <label>Display walls</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-paths" value="graph">
                <label>Display paths</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-all" value="both"
                    checked>
                <label>Display all</label>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-sm text-center">
                <label for="heightRange">Height</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="range" class="form-range" id="heightRange" min="1" max="20" value="6">
                    <span class="w-25" id="height-current-value"></span>
                </div>
            </div>
            <div class="col-sm text-center">
                <label for="widthRange">Width</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="range" class="form-range" id="widthRange" min="1" max="20" value="6">
                    <span class="w-25" id="width-current-value"></span>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="d-flex flex-column align-items-center gap-2">
                <button class="btn btn-primary directional-input" title="Move origin up" id="directional-up">↑</button>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary directional-input" title="Move origin left"
                        id="directional-left">←</button>

                    <button class="btn btn-primary directional-input" title="Randomly move origin"
                        id="directional-random">○</button>

                    <button class="btn btn-primary directional-input" title="Move origin right"
                        id="directional-right">→</button>
                </div>
                <button class="btn btn-primary directional-input" title="Move origin down"
                    id="directional-down">↓</button>
            </div>
        </div>
        <div class="row container text-center mt-3">
            <button class="btn btn-primary" id="start-button" title="Toggle between random generation">Start random
                generation</button>
        </div>
    </div>
    <div class="container text-center mt-3 mb-3">
        <canvas id="maze-canvas" class="w-75"></canvas>
    </div>
</div>
