<div class="min-vh-100 d-flex flex-column">
    <div class="container text-center mt-5">
        <h1 class="mb-4">Maze Generator Visualiser</h1>
    </div>
    <div class="container" id="maze-settings">
        <div class="row">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-walls">
                <label>Display walls</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-path">
                <label>Display path</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="maze-display" id="maze-display-all" checked>
                <label>Display all</label>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-sm text-center">
                <label for="heightRange">Height</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="range" class="form-range" id="heightRange" min="1" max="20" value="6">
                    <span class="w-25" id="height-current-value"></span>
                </div>
            </div>
            <div class="col-sm text-center">
                <label for="widthRange">Width</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="range" class="form-range" id="widthRange" min="1" max="20" value="6">
                    <span class="w-25" id="width-current-value"></span>
                </div>
            </div>
        </div>
        <div class="container text-center row mt-3">
            <button class="btn btn-primary" id="start-button">Start</button>
        </div>
    </div>
    <div class="container text-center mt-3 mb-3">
        <canvas id="maze-canvas" class="w-75" style="border:1px solid #000000;"></canvas>
    </div>
</div>
